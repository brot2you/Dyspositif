<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script src="https://brot2you.github.io/b2y-outils/b2y-sauvegarde.js" data-app="Dyspositif" data-keys="brot2you-multitool-v1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dyspositif — Dys+ by BROT2YOU</title>
<link rel="icon" href="data:image/svg+xml,<svg viewBox='0 0 56 48' xmlns='http://www.w3.org/2000/svg'><rect x='2' y='6' width='44' height='38' rx='11' fill='%23FFB547' stroke='%231D1B2E' stroke-width='3'/><text x='24' y='32' text-anchor='middle' font-family='Fredoka,Lexend,sans-serif' font-weight='700' font-size='17' fill='%231D1B2E'>Dys</text><circle cx='44' cy='11' r='9.5' fill='%23E8413B' stroke='%231D1B2E' stroke-width='3'/><path d='M44 6.5v9M39.5 11h9' stroke='%23fff' stroke-width='3' stroke-linecap='round'/></svg>">
<meta name="description" content="La boîte à outils du quotidien pour les élèves DYS et TDAH : lire, comprendre les consignes, s'organiser, se concentrer.">
<meta name="theme-color" content="#FFF4E2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF4E2; --ink:#1D1B2E; --ink2:#5B576D; --soft:#E8DCC6; --blanc:#FFFDF8;
  --t:#FFB547;
  --h:#E8413B; --h-dark:#A82621; --h-txt:#FFFFFF;
  --rf:'Lexend',sans-serif; --rs:20px; --rlh:1.7; --rls:.02em; --rws:.12em; --rbg:#FFF8EC;
  --c0:#1F5FAD; --c1:#C62828;
  --ombre:4px 4px 0 var(--ink);
  --titre:'Fredoka','Lexend',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg) radial-gradient(#EBD9B8 1.3px,transparent 1.5px) 0 0/24px 24px;
  font-family:'Lexend',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid #2F6FEB;outline-offset:3px}
[hidden]{display:none!important}
.ic{display:inline-flex;width:22px;height:22px;flex:0 0 auto}
.ic svg{width:100%;height:100%}

/* ---------- barre du haut */
#bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:#FFFFFF;border-bottom:3px solid var(--ink)}
body.dans-outil #bar{background:var(--t)}
.marque{display:flex;align-items:center;gap:10px;font-family:var(--titre);font-weight:700;font-size:27px;white-space:nowrap}
.marque svg{width:50px;height:44px}
.marque small{font-family:'Lexend',sans-serif;font-weight:500;font-size:12px;color:var(--ink2);margin-left:2px}
.bar-titre{display:flex;align-items:center;gap:10px;font-family:var(--titre);font-weight:700;font-size:25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-titre .rond{width:44px;height:44px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.bar-titre .rond .ic{width:24px;height:24px}
.spacer{flex:1}
.icobtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:48px;height:48px;padding:0 14px;border-radius:14px;border:3px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);font-family:var(--titre);font-weight:600;font-size:18px;white-space:nowrap}
.icobtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.icobtn .ic{width:21px;height:21px}
.icobtn.chrono{font-variant-numeric:tabular-nums;background:#FFF0EE}
.icobtn.chrono::before{content:'';width:10px;height:10px;border-radius:50%;background:#E8413B;animation:clign 1.6s ease-in-out infinite}
@keyframes clign{50%{opacity:.25}}

main#view{padding:22px 16px 80px}

/* ---------- accueil */
.accueil{max-width:980px;margin:0 auto}
.hero{display:flex;align-items:center;gap:20px;justify-content:space-between;flex-wrap:wrap}
.hero h1{font-family:var(--titre);font-weight:700;font-size:44px;line-height:1.05;margin:0}
.hero p{margin:8px 0 0;font-size:18px;color:var(--ink2)}
.hero .date{display:inline-block;margin-top:12px;padding:6px 14px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;font-weight:600;font-size:15px}
.couteau-svg{width:310px;max-width:100%;height:auto;overflow:visible}
.couteau-svg .lsvg{transition:transform .9s cubic-bezier(.3,1.5,.5,1);transform-box:view-box;transform-origin:0 0}
.aujourdhui{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 6px}
.info{display:flex;align-items:center;gap:12px;padding:12px 16px;border:3px solid var(--ink);border-radius:18px;background:#fff;box-shadow:var(--ombre);text-align:left;min-height:64px;font-size:16px;max-width:100%}
.info:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.info .pas{width:40px;height:40px;border-radius:12px;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.info .pas .ic{width:22px;height:22px}
.info b{display:block;font-family:var(--titre);font-weight:600;font-size:18px}
.info small{color:var(--ink2);font-size:14px}
.info svg.met{width:30px;height:30px}
.section-titre{font-family:var(--titre);font-weight:600;font-size:22px;margin:28px 0 12px}
.tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.tuile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:18px;min-height:150px;background:var(--t);border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink);text-align:left;
  transition:transform .15s,box-shadow .15s;animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
.tuile:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.tuile:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.tuile .pastille-ic{width:58px;height:58px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center}
.tuile .pastille-ic .ic{width:30px;height:30px}
.tuile .nom{font-family:var(--titre);font-weight:700;font-size:25px;line-height:1.1}
.tuile .sous{font-size:15px;line-height:1.35}
.tuile .fleche{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--ink);background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center}
.tuile .fleche .ic{width:18px;height:18px;transform:rotate(180deg)}
.puces{display:flex;flex-wrap:wrap;gap:10px}
.puce-lame{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;border:2.5px solid var(--ink);background:#fff;font-size:15px;font-weight:500;min-height:48px}
.puce-lame .rond{width:32px;height:32px;border-radius:50%;background:var(--t);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center}
.puce-lame .ic{width:17px;height:17px}

/* ---------- feuille de travail */
.sheet{max-width:900px;margin:0 auto;background:var(--blanc);border:3px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--ink);padding:26px 26px 32px;font-family:var(--rf);position:relative;font-size:17px;line-height:1.55}
.titre{font-family:var(--titre);font-weight:600;font-size:23px;margin:24px 0 8px;color:var(--ink);line-height:1.2}
.titre:first-child{margin-top:2px}
.aide{color:var(--ink2);font-size:16px;margin:2px 0 14px;line-height:1.5}
.note{font-size:15px;color:var(--ink2);background:#F6EFE2;border-radius:12px;padding:10px 14px;margin:16px 0}
.alerte{background:#FFE9D6;border:2.5px solid var(--ink);border-radius:14px;padding:12px 16px;margin:10px 0;font-size:16px}
.lisible{font-family:var(--rf);font-size:var(--rs);line-height:var(--rlh);letter-spacing:var(--rls);word-spacing:var(--rws)}
.zone{position:relative;overflow:auto;max-height:62vh;padding:18px 20px;border:2.5px solid var(--ink);border-radius:16px;background:var(--rbg)}
textarea,input[type=text],input[type=date],select{font-family:var(--rf);font-size:18px;width:100%;padding:13px 15px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink)}
textarea{resize:vertical;line-height:1.5}
textarea.lisible{font-size:var(--rs);line-height:var(--rlh);background:var(--rbg)}
textarea:focus,input:focus,select:focus{outline:none;box-shadow:0 0 0 4px var(--t)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;border:3px solid var(--ink);background:#fff;
  font-family:var(--titre);font-weight:600;font-size:18px;color:var(--ink);box-shadow:3px 3px 0 var(--ink);text-decoration:none}
.btn:hover{background:#FFF8EA}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.prim{background:var(--t)}
.btn.petit{min-height:44px;padding:0 14px;font-size:16px}
.btn.gros{min-height:66px;font-size:22px;padding:0 30px;border-radius:18px;box-shadow:4px 4px 0 var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn .ic{width:21px;height:21px}
.rang{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:14px 0}
.onglets{display:flex;gap:8px;margin:-4px 0 20px;flex-wrap:wrap;padding:6px;background:#F3EADB;border-radius:18px}
.onglet{border:2.5px solid transparent;background:none;padding:10px 16px;font-family:var(--titre);font-weight:600;font-size:18px;color:var(--ink2);border-radius:13px;min-height:48px}
.onglet.on{color:var(--ink);background:var(--t);border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.choix{display:inline-flex;border:2.5px solid var(--ink);border-radius:14px;overflow:hidden;flex-wrap:wrap;background:#fff}
.choix button{border:none;background:#fff;padding:8px 16px;min-height:46px;font-weight:600;font-size:15px}
.choix button+button{border-left:2.5px solid var(--ink)}
.choix button.on{background:var(--t)}
.puce{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;min-height:46px;border-radius:999px;border:2.5px solid var(--ink);background:#fff;font-size:15px;font-weight:500}
.puce.on{background:var(--t);box-shadow:2px 2px 0 var(--ink);font-weight:600}
.pastille{width:13px;height:13px;border-radius:50%;display:inline-block;flex:0 0 auto;border:2px solid var(--ink)}
.carte-item{background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:16px 18px;margin:12px 0}
.ligne-coche{display:flex;align-items:center;gap:14px;padding:13px 16px;border:2.5px solid var(--ink);border-radius:16px;background:#fff;margin:10px 0;font-size:18px;width:100%;text-align:left;font-family:var(--rf)}
.case{width:34px;height:34px;border:3px solid var(--ink);border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#fff;color:transparent}
.case .ic{width:22px;height:22px}
.ligne-coche.fait{background:#F6F1E6}
.ligne-coche.fait .case{background:var(--t);color:var(--ink)}
.ligne-coche.fait .txt{text-decoration:line-through;opacity:.55}
.vide{padding:24px;border:3px dashed #C9B999;border-radius:18px;text-align:center;color:var(--ink2);background:#FFFBF3}
.lab{display:block;font-weight:600;margin:16px 0 6px;font-size:16px}
input[type=range]{width:100%;accent-color:var(--ink);height:34px}
.bascule{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:16px;cursor:pointer}
input.sw{-webkit-appearance:none;appearance:none;width:58px;height:34px;border-radius:17px;background:#E4DACA;border:2.5px solid var(--ink);position:relative;flex:0 0 auto;cursor:pointer;margin:0}
input.sw::after{content:'';position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);transition:left .2s}
input.sw:checked{background:var(--t)}
input.sw:checked::after{left:26px}
.mini{width:44px;height:44px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:600}
.mini .ic{width:19px;height:19px}
.mini[disabled]{opacity:.3}
.grille2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.echelle{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:-4px}

/* lecteur */
.mot{border-radius:5px;cursor:pointer}
.phrase-on{background:rgba(255,200,80,.35)}
.mot-on{background:#FFC83D;color:var(--ink);box-shadow:0 0 0 3px #FFC83D}
.regle{position:absolute;left:0;right:0;pointer-events:none;box-shadow:0 0 0 3000px rgba(29,27,46,.45);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);z-index:2}

/* syllabes */
.syl .s0{color:var(--c0)} .syl .s1{color:var(--c1)}
.syl.arcs .sy{color:var(--ink);border-bottom:3px solid var(--c0);border-radius:0 0 60% 60%/0 0 12px 12px;padding:0 1px 3px;margin:0 1px}
.syl.arcs .s1{border-bottom-color:var(--c1)}
.syl .muet{color:#A8A0B0!important}
.syl .son{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.syl .w{cursor:pointer;white-space:nowrap;border-radius:5px}
.syl .w:hover{background:rgba(255,200,80,.3)}
.palettes{display:flex;gap:10px;flex-wrap:wrap}
.palette{display:inline-flex;gap:4px;padding:7px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;min-height:46px;align-items:center}
.palette.on{background:var(--t);box-shadow:2px 2px 0 var(--ink)}
.palette i{width:22px;height:22px;border-radius:6px;display:block;border:2px solid var(--ink)}

/* consignes */
.action{display:grid;grid-template-columns:54px 1fr;gap:14px;background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:18px;margin:14px 0;box-shadow:4px 4px 0 var(--cat)}
.action .num{width:50px;height:50px;border-radius:50%;background:var(--cat);color:#fff;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--titre);font-weight:700;font-size:26px}
.action .num .ic{width:24px;height:24px}
.verbe{font-family:var(--titre);font-weight:700;font-size:30px;line-height:1.1}
.cat-tag{display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:600;color:var(--cat);margin-bottom:2px}
.cat-tag .ic{width:17px;height:17px}
.att{font-size:18px;font-weight:500;margin:6px 0}
ol.faire{margin:8px 0;padding-left:24px} ol.faire li{margin:5px 0}
.exemple{background:#F6EFE2;border-radius:12px;padding:10px 14px;font-size:16px;margin-top:10px}
.piege{font-size:15px;color:#9A3412;margin-top:10px;font-weight:500}
mark.v{background:none;border-bottom:5px solid var(--cat);font-weight:700;color:inherit}
.indices li{margin:6px 0}
.cat-bloc{margin:6px 0;border:2.5px solid var(--ink);border-radius:16px;background:#fff;padding:0 14px}
.cat-bloc summary{cursor:pointer;font-weight:600;padding:12px 0;font-size:17px;list-style:none;display:flex;align-items:center;gap:12px}
.cat-bloc summary::-webkit-details-marker{display:none}
.cat-bloc summary::before{content:'+';display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--cat);color:#fff;border:2.5px solid var(--ink);align-items:center;justify-content:center;font-weight:700}
.cat-bloc[open] summary::before{content:'–'}

/* étapes */
.focus{text-align:center;padding:6px 0}
.compteur{font-family:var(--titre);color:var(--ink2);font-weight:600;font-size:19px}
.etape-txt{font-size:calc(var(--rs) * 1.3);line-height:1.45;margin:22px auto;max-width:640px;font-weight:600;min-height:3em;padding:24px;background:var(--rbg);border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--t)}
.crans{display:flex;gap:7px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.cran{width:34px;height:14px;border-radius:7px;background:#fff;border:2.5px solid var(--ink)}
.cran.fait{background:var(--t)} .cran.cur{background:var(--ink)}
.ligne-etape{display:flex;align-items:center;gap:8px;margin:8px 0}
.ligne-etape .n{font-family:var(--titre);font-weight:700;font-size:20px;width:36px;height:36px;border-radius:50%;background:var(--t);border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ligne-etape input{flex:1}

/* sablier */
.cadran-w{display:flex;justify-content:center;margin:6px 0}
svg.cadran{width:min(82vw,360px);height:auto;touch-action:none;cursor:grab;user-select:none}
.temps{font-family:var(--titre);font-weight:700;font-size:50px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.phase{text-align:center;font-family:var(--titre);font-weight:600;font-size:20px;margin:4px 0}
.fini svg.cadran{animation:pulse 1.1s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.04)}}

/* opérations */
.grille-w{overflow-x:auto;padding:4px 0}
.grille{display:inline-grid;gap:5px;padding:16px;background:#fff;border:2.5px solid var(--ink);border-radius:18px}
.gc{width:52px;height:58px;display:flex;align-items:center;justify-content:center;font-size:30px;font-family:'Lexend',sans-serif;border-radius:8px}
input.gc{border:2.5px solid var(--ink);text-align:center;padding:0;font-size:30px;width:52px;-moz-appearance:textfield}
.gret{height:40px!important;font-size:18px!important;color:#C2410C}
input.gret{border-style:dashed}
.glab{height:24px!important;font-size:13px!important;color:var(--ink2);font-weight:600}
.gsigne{font-weight:700;color:var(--ink)}
.gtrait{grid-column:1/-1;height:4px;background:var(--ink);border-radius:2px;margin:2px 0}
.ok{background:#C8F0C3!important}
.ko{background:#FFD0B0!important}
.symboles{display:flex;gap:8px}

/* aides */
.pyth-w{overflow-x:auto}
table.pyth{border-collapse:separate;border-spacing:3px;margin:8px 0;font-variant-numeric:tabular-nums}
.pyth th,.pyth td{width:44px;height:44px;text-align:center;font-size:18px;padding:0;border-radius:8px}
.pyth th{background:var(--t);font-weight:700;border:2px solid var(--ink)}
.pyth td{background:#fff;cursor:pointer;border:2px solid #D8CBB3}
.pyth .hl{background:#FFF0C7}
.pyth .sel{background:var(--ink);color:#fff;font-weight:700;border-color:var(--ink)}
.resultat-pyth{font-family:var(--titre);font-size:calc(var(--rs) * 1.7);font-weight:700;min-height:1.5em;font-variant-numeric:tabular-nums}
.fiches{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.fiche{background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:16px;text-align:left;min-height:120px;font-family:var(--rf);box-shadow:4px 4px 0 var(--fc)}
.fiche b{display:block;font-family:var(--titre);font-weight:600;font-size:20px;margin-bottom:6px}
.fiche span{font-size:14px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fiche-vue{white-space:pre-wrap}

/* pause */
.souffle{display:flex;flex-direction:column;align-items:center;gap:16px;padding:14px 0}
.bulle{width:240px;height:240px;border-radius:50%;background:var(--t);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);display:flex;align-items:center;justify-content:center;
  font-family:var(--titre);font-weight:700;font-size:30px;transform:scale(.62);transition-property:transform;transition-timing-function:ease-in-out}
.barre-prog{width:100%;max-width:420px;height:20px;border-radius:10px;background:#fff;border:2.5px solid var(--ink);overflow:hidden}
.barre-prog i{display:block;height:100%;background:var(--t);width:0;transition:width .3s linear}
.mouvement{font-size:calc(var(--rs) * 1.25);font-weight:600;text-align:center;max-width:560px;min-height:3em}

/* météo */
.meteos{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
.meteo-btn{background:#fff;border:2.5px solid var(--ink);border-radius:20px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:16px;min-height:155px;text-align:center;font-family:var(--rf);box-shadow:3px 3px 0 var(--ink)}
.meteo-btn.on{background:var(--t);box-shadow:5px 5px 0 var(--ink)}
.meteo-btn svg{width:74px;height:74px}
.releves{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.releves svg{width:34px;height:34px}
.releve{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--ink2);width:46px}

/* carte de besoins (plein écran) */
.plein{position:fixed;inset:0;z-index:50;background:rgba(29,27,46,.78);overflow:auto;padding:18px}
.carte-id{max-width:740px;margin:16px auto;background:#FFFDF8;border:4px solid var(--ink);border-radius:26px;overflow:hidden;box-shadow:8px 8px 0 #F5A9D6;font-family:var(--rf)}
.carte-id .bandeau{background:#F5A9D6;color:var(--ink);padding:20px 26px;border-bottom:4px solid var(--ink)}
.carte-id .bandeau b{font-family:var(--titre);font-weight:600;font-size:17px;display:block}
.carte-id h2{margin:4px 0 0;font-family:var(--titre);font-size:34px;line-height:1.15}
.carte-id .corps{padding:18px 28px 28px;font-size:20px;line-height:1.55}
.carte-id h4{font-family:var(--titre);font-weight:600;font-size:20px;margin:18px 0 6px}
.carte-id ul{margin:0;padding-left:26px}
.plein .rang{max-width:740px;margin:0 auto}

/* popover Aa */
#pop{position:fixed;top:78px;right:12px;z-index:40;width:min(400px,calc(100vw - 24px));background:#FFFDF8;border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:18px;max-height:calc(100vh - 96px);overflow:auto;font-size:16px;--t:#FFE38F}
.polices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.polices button{min-height:50px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;font-size:17px}
.polices button.on{background:var(--t);box-shadow:2px 2px 0 var(--ink)}
.fonds{display:flex;gap:8px;flex-wrap:wrap}
.fond{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--ink)}
.fond.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink)}
.apercu{padding:12px 14px;border-radius:14px;border:2.5px solid var(--ink);margin-top:12px;background:var(--rbg)}

/* atelier */
.ligne-lame{display:flex;align-items:center;gap:12px;padding:10px 12px;background:#fff;border:2.5px solid var(--ink);border-radius:16px;margin:10px 0}
.ligne-lame .rond{width:42px;height:42px;border-radius:50%;background:var(--t);border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ligne-lame .rond .ic{width:21px;height:21px}
.ligne-lame .grow{flex:1;min-width:0}
.ligne-lame .grow b{display:block;font-family:var(--titre);font-weight:600;font-size:18px}
.ligne-lame .grow small{color:var(--ink2);font-size:14px}
.ligne-lame.off{background:#F7F1E6}
.ligne-lame.off .rond{filter:grayscale(.7);opacity:.7}
.manches{display:flex;gap:12px;flex-wrap:wrap}
.manche-c{width:54px;height:54px;border-radius:50%;border:3px solid var(--ink)}
.manche-c.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink)}

/* montage (premier lancement) */
.montage{max-width:900px;margin:0 auto}
.montage .tete{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.montage h1{font-family:var(--titre);font-weight:700;font-size:46px;margin:0;line-height:1.05}
.montage p{color:var(--ink2);font-size:18px}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:8px}
.pack{text-align:left;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:22px;padding:18px 56px 18px 18px;min-height:140px;position:relative;font-family:'Lexend',sans-serif;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.pack.on{background:var(--pc);transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.pack .t{font-family:var(--titre);font-weight:600;font-size:21px;display:block;line-height:1.2}
.pack .d{font-size:15px;color:var(--ink2);margin-top:6px;display:block}
.pack.on .d{color:var(--ink)}
.pack .lst{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pack .lst span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;border:2px solid var(--ink);background:#fff}
.pack .case{position:absolute;top:16px;right:16px}
.pack.on .case{background:#fff;color:var(--ink)}

#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140px);background:var(--ink);color:#fff;padding:14px 22px;border-radius:16px;transition:transform .3s,visibility .3s;visibility:hidden;z-index:60;font-size:16px;font-weight:500;max-width:90vw;box-shadow:4px 4px 0 var(--t)}
#toast.on{transform:translate(-50%,0);visibility:visible}

@media (max-width:640px){
  .hero h1{font-size:34px}
  .couteau-svg{width:250px;margin:0 auto}
  .hero{justify-content:center}
  .hero>div:first-child{width:100%}
  .tuiles{grid-template-columns:1fr 1fr;gap:12px}
  .tuile{min-height:138px;padding:14px;border-radius:18px;box-shadow:4px 4px 0 var(--ink)}
  .tuile .pastille-ic{width:48px;height:48px}
  .tuile .pastille-ic .ic{width:25px;height:25px}
  .tuile .nom{font-size:21px}
  .tuile .sous{font-size:13px}
  .tuile .fleche{display:none}
  .sheet{padding:22px 16px 26px;border-radius:20px}
  .gc,input.gc{width:40px;height:48px;font-size:24px}
  .icobtn .lbl{display:none}
  .marque small{display:none}
  .bar-titre{font-size:21px}
  .bar-titre .rond{width:38px;height:38px}
  .grille2{grid-template-columns:1fr}
  .montage h1{font-size:34px}
  .pyth th,.pyth td{width:30px;height:34px;font-size:14px}
  .info{flex:1 1 100%}
}

/* autocollants, fêtes */
.confettis{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confettis i{position:absolute;top:-24px;width:11px;height:16px;border:2px solid var(--ink);animation-name:tombe;animation-timing-function:cubic-bezier(.3,.6,.6,1);animation-fill-mode:forwards}
@keyframes tombe{to{top:106%;transform:translateX(50px) rotate(640deg)}}
.fete{position:fixed;inset:0;z-index:65;background:rgba(29,27,46,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.fete-carte{background:#FFFDF8;border:4px solid var(--ink);border-radius:28px;box-shadow:8px 8px 0 var(--ink);padding:26px 30px;text-align:center;max-width:390px;width:100%;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.fete-titre{font-family:var(--titre);font-weight:600;font-size:20px;color:var(--ink2)}
.fete-collant svg{width:150px;height:150px;margin:8px 0;animation:tourne .9s cubic-bezier(.3,1.6,.5,1) both}
@keyframes tourne{from{transform:scale(.2) rotate(-120deg)}to{transform:none}}
.fete-nom{font-family:var(--titre);font-weight:700;font-size:30px;line-height:1.1}
.collants{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:14px;box-shadow:var(--ombre)}
.collant{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:14px}
.collant:hover{background:#FFF4E2}
.collant svg{width:64px;height:64px}
.collant:not(.verrou) svg{filter:drop-shadow(2px 2px 0 rgba(29,27,46,.25))}
.collant small{font-size:12.5px;font-weight:600;text-align:center;line-height:1.2}
.collant.verrou small{color:#A8987A}
.compte{display:inline-block;font-family:'Lexend',sans-serif;font-size:15px;font-weight:600;padding:2px 12px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;margin-left:10px;vertical-align:middle}
.info.bilan{background:#FFFBEA}
.pied{text-align:center;margin-top:34px}
.lien{background:none;border:none;text-decoration:underline;text-underline-offset:4px;color:var(--ink2);font-size:15px;padding:8px}
/* je travaille */
.focus-zone{text-align:center}
.focus-top{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:6px}
.focus-ctrl{display:flex;flex-direction:column;gap:10px}
.anneau{width:150px;height:150px}
.choix-tache{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border:2.5px solid var(--ink);border-radius:16px;background:#fff;margin:8px 0;font-size:17px;font-family:var(--rf)}
.choix-tache small{color:var(--ink2)}
.choix-tache.on{background:var(--t);box-shadow:3px 3px 0 var(--ink)}
.choix-tache.on .case{color:var(--ink)}
/* espace prof */
.qr{margin-top:14px}
.qr svg{width:min(300px,80vw);height:auto;border:3px solid var(--ink);border-radius:18px;padding:6px;background:#fff;box-shadow:var(--ombre)}
@media (max-width:640px){.collants{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}.collant svg{width:54px;height:54px}}

/* icônes illustrées */
.img-ic{width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none;user-select:none}
.tuile .pastille-ic{width:84px;height:84px;background:none;border:none;border-radius:0;margin:-4px 0 -2px -4px}
.tuile .pastille-ic .img-ic{filter:drop-shadow(2px 3px 0 rgba(29,27,46,.18))}
.tuile:hover .pastille-ic{transform:rotate(-5deg) scale(1.06);transition:transform .2s}
.avec-img{background:none!important;border:none!important}
.bar-titre .rond.avec-img{width:48px;height:48px}
.puce-lame .rond.avec-img{width:36px;height:36px}
.ligne-lame .rond.avec-img{width:52px;height:52px}
.info .pas.avec-img{width:52px;height:52px;border-radius:0}
.info .pas.avec-img img{width:100%;height:100%;object-fit:contain}
.btn-focus .img-ic{width:46px;height:46px;margin:-6px 4px -6px -8px}
.meteo-btn img{width:86px;height:86px;object-fit:contain}
.releves img{width:36px;height:36px;object-fit:contain}
.collant img{width:72px;height:72px;object-fit:contain}
.collant img.verrou-img{filter:grayscale(1);opacity:.25}
.fete-collant img{width:170px;height:170px;margin:8px 0;animation:tourne .9s cubic-bezier(.3,1.6,.5,1) both}
@media (max-width:640px){.tuile .pastille-ic{width:66px;height:66px}.collant img{width:60px;height:60px}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media print{
  body{background:#fff}
  #bar,#view,#toast,#pop,.no-print{display:none!important}
  .plein{position:static;background:none;padding:0}
  .carte-id{box-shadow:none}
}
</style>
</head>

<div id="toast" role="status" aria-live="polite"></div>

/* =========================================================
   Règle de lecture (bande qui suit le doigt / la souris)
   ========================================================= */
function regle(zone) {
  var bande = null, y = 0;
  function hauteur() {
    var cs = window.getComputedStyle(zone), lh = parseFloat(cs.lineHeight);
    if (isNaN(lh)) lh = parseFloat(cs.fontSize) * 1.6;
    return Math.round(lh * 1.15);
  }
  function placer(py) {
    if (!bande) return;
    var hh = hauteur(); bande.style.height = hh + 'px'; y = Math.max(hh / 2, py);
    bande.style.top = (y - hh / 2) + 'px';
  }
  function pos(ev) {
    var r = zone.getBoundingClientRect(), cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
    placer(cy - r.top + zone.scrollTop);
  }
  zone.addEventListener('mousemove', function (e) { if (bande) pos(e); });
  zone.addEventListener('touchstart', function (e) { if (bande) pos(e); }, { passive: true });
  zone.addEventListener('touchmove', function (e) { if (bande) pos(e); }, { passive: true });
  zone.addEventListener('keydown', function (e) {
    if (!bande) return;
    if (e.keyCode === 40) { placer(y + hauteur() / 1.15); e.preventDefault(); }
    if (e.keyCode === 38) { placer(y - hauteur() / 1.15); e.preventDefault(); }
  });
  return {
    basculer: function (on) {
      if (on && !bande) { bande = h('div', { 'class': 'regle' }); zone.appendChild(bande); zone.setAttribute('tabindex', '0'); placer(hauteur() / 2 + 16); }
      else if (!on && bande) { if (bande.parentNode) bande.parentNode.removeChild(bande); bande = null; }
    },
    rafraichir: function () { if (bande && bande.parentNode !== zone) { zone.appendChild(bande); placer(y); } }
  };
}

    setTimeout(function () { bEffacer._arme = false; vider(bEffacer); ajoute(bEffacer, [ico('poubelle'), 'Tout effacer']); }, 4000);
  }, 'petit');
  ajoute(sh, [
    h('div', { 'class': 'titre' }, 'Mes lames'),
    h('p', { 'class': 'aide' }, 'Monte les lames qui t’aident, range les autres. Les flèches changent l’ordre sur le couteau.'), zl,
    h('div', { 'class': 'titre' }, 'Couleur du manche'), manches,
    h('div', { 'class': 'titre' }, 'Gravure'), grav,
    h('div', { 'class': 'titre' }, 'Confort de lecture'), conf,
    h('div', { 'class': 'titre' }, 'Sons'), bascule('Petits sons (fin du sablier, étape faite)', S.sons, function (on) { S.sons = on; sauver(); }),
    h('div', { 'class': 'titre' }, 'Fêtes'), bascule('Confettis quand je gagne un autocollant ou que je finis quelque chose', S.fetes, function (on) { S.fetes = on; sauver(); }),
    h('div', { 'class': 'titre' }, 'Espace prof'),
    h('p', { 'class': 'aide' }, 'Pour les enseignants : préparer un lien ou un QR code qui pré-remplit le Dyspositif des élèves (emploi du temps, texte, consigne, tâche, devoir, fiche).'),
    h('div', { 'class': 'rang' }, btn('Ouvrir l’espace prof', 'carte', function () { aller('prof'); })),
    h('div', { 'class': 'titre' }, 'Sauvegarde'),
    h('p', { 'class': 'aide' }, 'Tout est enregistré sur cet appareil. Pour garder ta progression ou la retrouver sur un autre appareil, touche le bouton 💾 en bas à gauche de l’écran : « Exporter ma progression » crée un fichier, « Importer une sauvegarde » le recharge.'),
    h('div', { 'class': 'rang', style: 'margin-top:20px' },
      btn('Refaire le montage', 'reprendre', function () { S.monte = false; sauver(); aller(''); }, 'petit'), bEffacer),
    h('p', { 'class': 'note', style: 'margin-top:24px' }, 'Dyspositif (Dys+) · by BROT2YOU — fonctionne sans compte et sans connexion une fois la page chargée (sauf certaines voix de lecture).')
  ]);
}
