<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multitool — by BROT2YOU</title>
<meta name="description" content="La boîte à outils du quotidien pour les élèves DYS et TDAH : lire, comprendre les consignes, s'organiser, se concentrer.">
<meta name="theme-color" content="#24463C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --mat:#2B5246; --mat2:#22433A;
  --ink:#1E2226; --ink2:#575E66; --line:#D9D1C3;
  --paper:#F6F1E7;
  --h:#B5212B; --h-dark:#7E141C; --h-txt:#FFFFFF;
  --rf:'Lexend',sans-serif; --rs:20px; --rlh:1.7; --rls:.02em; --rws:.12em; --rbg:#F6F1E7;
  --c0:#1F5FAD; --c1:#C62828;
  --steel:linear-gradient(180deg,#F5F6F7 0%,#DEE1E4 38%,#BDC2C7 56%,#E6E8EA 100%);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background-color:var(--mat);
  background-image:
    linear-gradient(rgba(255,255,255,.13) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.13) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px;
  background-attachment:fixed;
  font-family:'Lexend',sans-serif;color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #F2B33D;outline-offset:2px}
[hidden]{display:none!important}
.ic{display:inline-flex;width:22px;height:22px;flex:0 0 auto}
.ic svg{width:100%;height:100%}

/* ---------- barre du haut (bord de tapis gradué) */
#bar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:10px 14px 18px;background-color:var(--mat2);
  background-image:
    repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 1px,transparent 1px 50px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 1px,transparent 1px 10px);
  background-size:100% 10px,100% 5px;background-repeat:no-repeat;background-position:left bottom,left bottom;
  box-shadow:0 2px 0 rgba(0,0,0,.25);
}
.marque{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.22em;color:#F3EFE6;font-size:24px;white-space:nowrap}
.marque small{font-weight:500;letter-spacing:.14em;opacity:.55;font-size:12px;margin-left:8px}
.bar-titre{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#F3EFE6;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.icobtn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:46px;height:46px;padding:0 12px;
  border-radius:8px;border:none;background:var(--steel);color:#30363C;
  box-shadow:inset 0 1px 0 #fff,0 2px 0 rgba(0,0,0,.4);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;
}
.icobtn:active{transform:translateY(1px);box-shadow:inset 0 1px 0 #fff,0 1px 0 rgba(0,0,0,.4)}
.icobtn .ic{width:20px;height:20px}
.icobtn.chrono{color:var(--h-dark);font-variant-numeric:tabular-nums}
.icobtn.chrono::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--h);box-shadow:0 0 0 2px rgba(181,33,43,.25)}

main#view{padding:20px 14px 70px}

/* ---------- le couteau */
.couteau{display:flex;max-width:760px;margin:6px auto 0;align-items:stretch}
.manche{
  flex:0 0 68px;border-radius:34px;position:relative;z-index:3;
  background:linear-gradient(90deg,rgba(0,0,0,.38),rgba(0,0,0,0) 26%,rgba(255,255,255,.3) 45%,rgba(255,255,255,0) 60%,rgba(0,0,0,.34)),var(--h);
  box-shadow:0 8px 16px rgba(0,0,0,.4),inset 0 0 0 1px rgba(0,0,0,.25);
  min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:22px 0;
}
.rivet{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#C9CED2 40%,#8D9399 75%,#6C7278);box-shadow:0 1px 1px rgba(0,0,0,.45)}
.gravure{
  writing-mode:vertical-rl;transform:rotate(180deg);font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.32em;
  text-transform:uppercase;color:rgba(255,255,255,.66);text-shadow:0 -1px 0 rgba(0,0,0,.4);font-size:19px;max-height:62%;overflow:hidden;white-space:nowrap
}
.plaque{width:30px;height:46px;border-radius:15px;background:var(--steel);display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;color:#5A6066;letter-spacing:.08em;writing-mode:vertical-rl;box-shadow:inset 0 1px 0 #fff,0 1px 1px rgba(0,0,0,.4)}
.lames{flex:1;display:flex;flex-direction:column;gap:12px;margin-left:-32px;padding:16px 0;position:relative;z-index:2;min-width:0}
.lame-w{filter:drop-shadow(0 3px 2px rgba(0,0,0,.38));animation:ouvrir .6s cubic-bezier(.2,.8,.25,1) both;transform-origin:left center;border-radius:4px}
.lame-w:focus-within{outline:3px solid #F2B33D;outline-offset:3px}
@keyframes ouvrir{from{transform:translateX(-55%) scaleX(.35);opacity:0}to{transform:none;opacity:1}}
.lame{
  width:100%;min-height:70px;display:flex;align-items:center;gap:14px;padding:10px 72px 10px 48px;border:none;text-align:left;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 1px,rgba(0,0,0,.025) 1px 3px),var(--steel);
  color:#40464C;transition:transform .18s ease;
}
.lame:focus-visible{outline:none}
.lame-w:hover .lame{transform:translateX(8px)}
.lame:active{transform:translateX(12px)!important}
.t0{clip-path:polygon(0 0,86% 0,100% 64%,97% 100%,0 100%)}
.t1{clip-path:polygon(0 0,93% 0,100% 24%,100% 76%,93% 100%,0 100%)}
.t2{border-radius:0 40px 40px 0;
  background-image:repeating-linear-gradient(115deg,rgba(0,0,0,.1) 0 2px,transparent 2px 6px),repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 1px,rgba(0,0,0,.025) 1px 3px),var(--steel);
  background-size:26% 100%,auto,auto;background-position:right center,0 0,0 0;background-repeat:no-repeat,repeat,no-repeat}
.t3{clip-path:polygon(0 0,100% 0,100% 36%,92% 50%,100% 64%,100% 100%,0 100%)}
.lame .ic{width:30px;height:30px;color:#4A5157;filter:drop-shadow(0 1px 0 rgba(255,255,255,.85))}
.lame .nom{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:23px;letter-spacing:.1em;text-transform:uppercase;color:#3C4248;text-shadow:0 1px 0 rgba(255,255,255,.9),0 -1px 0 rgba(0,0,0,.14);line-height:1.1}
.lame .sous{display:block;font-size:14px;color:#5B6269;margin-top:2px}
.consigne-mat{max-width:760px;margin:16px auto 0;color:rgba(243,239,230,.75);font-size:14px;text-align:center}
.boite{max-width:760px;margin:30px auto 0;color:#EAE5DA}
.boite h2{font-family:'Barlow Condensed',sans-serif;letter-spacing:.18em;text-transform:uppercase;font-size:15px;font-weight:700;opacity:.75;margin:0 0 10px}
.puces{display:flex;flex-wrap:wrap;gap:8px}
.puce-lame{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.18);color:#F1ECE2;font-size:15px;min-height:44px}
.puce-lame .ic{width:18px;height:18px}

/* ---------- feuille de travail */
.sheet{max-width:880px;margin:0 auto;background:var(--rbg);border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:26px 24px 32px;font-family:var(--rf);position:relative;font-size:17px;line-height:1.5}
.sheet::before{content:'';position:absolute;left:0;right:0;top:0;height:6px;background:var(--h);border-radius:4px 4px 0 0}
.titre{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.07em;text-transform:uppercase;font-size:21px;margin:20px 0 8px;color:var(--ink)}
.titre:first-child{margin-top:4px}
.aide{color:var(--ink2);font-size:16px;margin:2px 0 14px;line-height:1.5}
.note{font-size:14px;color:var(--ink2);border-left:4px solid var(--line);padding:6px 12px;margin:14px 0}
.alerte{background:#FBE9D6;border:2px solid #E4A16A;border-radius:8px;padding:12px 14px;margin:10px 0;font-size:16px}
.lisible{font-family:var(--rf);font-size:var(--rs);line-height:var(--rlh);letter-spacing:var(--rls);word-spacing:var(--rws)}
.zone{position:relative;overflow:auto;max-height:62vh;padding:16px 18px;border:2px solid var(--line);border-radius:6px;background:rgba(255,255,255,.6);white-space:normal}
textarea,input[type=text],input[type=date],select{font-family:var(--rf);font-size:18px;width:100%;padding:12px 14px;border:2px solid #CDC5B6;border-radius:6px;background:#fff;color:var(--ink)}
textarea{resize:vertical;line-height:1.5}
textarea.lisible{font-size:var(--rs);line-height:var(--rlh)}
textarea:focus,input:focus,select:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px rgba(242,179,61,.6)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:7px;border:2px solid var(--ink);background:#fff;
  font-family:'Lexend',sans-serif;font-weight:600;font-size:16px;color:var(--ink);box-shadow:0 3px 0 var(--ink);text-decoration:none}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.prim{background:var(--h);color:var(--h-txt);border-color:var(--h-dark);box-shadow:0 3px 0 var(--h-dark)}
.btn.petit{min-height:42px;padding:0 12px;font-size:14px}
.btn.gros{min-height:66px;font-size:20px;padding:0 28px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn .ic{width:20px;height:20px}
.rang{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.onglets{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:-6px 0 18px;flex-wrap:wrap}
.onglet{border:none;background:none;padding:12px 12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.07em;text-transform:uppercase;font-size:18px;color:var(--ink2);border-bottom:4px solid transparent;margin-bottom:-2px}
.onglet.on{color:var(--ink);border-bottom-color:var(--h)}
.choix{display:inline-flex;border:2px solid var(--ink);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.choix button{border:none;background:#fff;padding:8px 14px;min-height:44px;font-weight:600;font-size:15px}
.choix button+button{border-left:2px solid var(--ink)}
.choix button.on{background:var(--ink);color:#fff}
.puce{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;min-height:44px;border-radius:6px;border:2px solid #CDC5B6;background:#fff;font-size:15px;font-weight:500}
.puce.on{border-color:var(--ink);background:var(--ink);color:#fff}
.pastille{width:12px;height:12px;border-radius:3px;display:inline-block;flex:0 0 auto}
.carte-item{background:#fff;border:2px solid var(--line);border-radius:8px;padding:14px 16px;margin:10px 0}
.ligne-coche{display:flex;align-items:center;gap:14px;padding:12px 14px;border:2px solid var(--line);border-radius:8px;background:#fff;margin:8px 0;font-size:18px;width:100%;text-align:left;font-family:var(--rf)}
.case{width:32px;height:32px;border:3px solid var(--ink);border-radius:6px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#fff;color:transparent}
.case .ic{width:20px;height:20px}
.ligne-coche.fait .case{background:var(--h);border-color:var(--h-dark);color:var(--h-txt)}
.ligne-coche.fait .txt{text-decoration:line-through;opacity:.5}
.vide{padding:22px;border:2px dashed #CDC5B6;border-radius:8px;text-align:center;color:var(--ink2)}
.lab{display:block;font-weight:600;margin:16px 0 6px;font-size:16px}
input[type=range]{width:100%;accent-color:var(--h);height:32px}
.bascule{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:16px;cursor:pointer}
input.sw{-webkit-appearance:none;appearance:none;width:54px;height:32px;border-radius:16px;background:#C9C2B5;position:relative;flex:0 0 auto;transition:background .2s;cursor:pointer;margin:0;border:none}
input.sw::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:left .2s}
input.sw:checked{background:var(--h)}
input.sw:checked::after{left:26px}
.mini{width:42px;height:42px;border-radius:6px;border:2px solid #CDC5B6;background:#fff;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.mini .ic{width:18px;height:18px}
.mini[disabled]{opacity:.3}
.grille2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.echelle{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:-4px}

/* lecteur */
.mot{border-radius:4px;cursor:pointer}
.phrase-on{background:rgba(242,179,61,.3)}
.mot-on{background:#F2B33D;color:#1E2226;box-shadow:0 0 0 3px #F2B33D}
.regle{position:absolute;left:0;right:0;pointer-events:none;box-shadow:0 0 0 3000px rgba(30,34,38,.45);border-top:3px solid var(--h);border-bottom:3px solid var(--h);z-index:2}

/* syllabes */
.syl .s0{color:var(--c0)} .syl .s1{color:var(--c1)}
.syl.arcs .sy{color:var(--ink);border-bottom:3px solid var(--c0);border-radius:0 0 60% 60%/0 0 12px 12px;padding:0 1px 3px;margin:0 1px}
.syl.arcs .s1{border-bottom-color:var(--c1)}
.syl .muet{color:#A59E92!important}
.syl .son{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.syl .w{cursor:pointer;white-space:nowrap;border-radius:4px}
.syl .w:hover{background:rgba(242,179,61,.25)}
.palettes{display:flex;gap:8px;flex-wrap:wrap}
.palette{display:inline-flex;gap:3px;padding:6px;border-radius:8px;border:2px solid #CDC5B6;background:#fff;min-height:44px;align-items:center}
.palette.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.palette i{width:20px;height:20px;border-radius:4px;display:block}

/* consignes */
.action{display:grid;grid-template-columns:52px 1fr;gap:14px;background:#fff;border:2px solid var(--line);border-left:8px solid var(--cat);border-radius:8px;padding:16px;margin:12px 0}
.action .num{width:48px;height:48px;border-radius:50%;background:var(--cat);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px}
.verbe{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px;letter-spacing:.05em;text-transform:uppercase;line-height:1.1}
.cat-tag{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--cat);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.cat-tag .ic{width:16px;height:16px}
.att{font-size:18px;font-weight:500;margin:6px 0}
ol.faire{margin:8px 0;padding-left:24px} ol.faire li{margin:4px 0}
.exemple{background:#F3EEE3;border-radius:6px;padding:10px 12px;font-size:16px;margin-top:8px}
.piege{font-size:15px;color:#8A3B12;margin-top:8px;font-weight:500}
mark.v{background:none;border-bottom:4px solid var(--cat);font-weight:700;color:inherit}
.indices li{margin:6px 0}
.cat-bloc{margin:8px 0}
.cat-bloc summary{cursor:pointer;font-weight:600;padding:10px 0;font-size:17px;list-style:none;display:flex;align-items:center;gap:10px}
.cat-bloc summary::-webkit-details-marker{display:none}
.cat-bloc summary::before{content:'+';display:inline-flex;width:26px;height:26px;border-radius:5px;border:2px solid var(--cat);color:var(--cat);align-items:center;justify-content:center;font-weight:700}
.cat-bloc[open] summary::before{content:'–'}

/* étapes */
.focus{text-align:center;padding:6px 0}
.compteur{font-family:'Barlow Condensed',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);font-weight:700;font-size:17px}
.etape-txt{font-size:calc(var(--rs) * 1.3);line-height:1.45;margin:22px auto;max-width:640px;font-weight:600;min-height:3em}
.crans{display:flex;gap:6px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.cran{width:30px;height:10px;border-radius:2px;background:#D6CFC2}
.cran.fait{background:var(--h)} .cran.cur{background:var(--ink)}
.ligne-etape{display:flex;align-items:center;gap:8px;margin:8px 0}
.ligne-etape .n{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;width:28px;text-align:center;color:var(--ink2)}
.ligne-etape input{flex:1}

/* sablier */
.cadran-w{display:flex;justify-content:center;margin:6px 0}
svg.cadran{width:min(82vw,360px);height:auto;touch-action:none;cursor:grab;user-select:none}
.temps{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:46px;text-align:center;letter-spacing:.04em;font-variant-numeric:tabular-nums;line-height:1}
.phase{text-align:center;font-family:'Barlow Condensed',sans-serif;letter-spacing:.16em;text-transform:uppercase;font-weight:700;font-size:18px;margin:4px 0}
.fini svg.cadran{animation:pulse 1.1s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.04)}}

/* opérations */
.grille-w{overflow-x:auto;padding:4px 0}
.grille{display:inline-grid;gap:4px;padding:14px;background:#fff;border:2px solid var(--line);border-radius:8px}
.gc{width:52px;height:58px;display:flex;align-items:center;justify-content:center;font-size:30px;font-family:'Lexend',sans-serif;border-radius:4px}
input.gc{border:2px solid #9AA1A8;text-align:center;padding:0;font-size:30px;width:52px;-moz-appearance:textfield}
.gret{height:40px!important;font-size:18px!important;color:var(--h)}
input.gret{border-style:dashed}
.glab{height:24px!important;font-size:13px!important;color:var(--ink2);font-weight:600}
.gsigne{font-weight:700;color:var(--ink)}
.gtrait{grid-column:1/-1;height:3px;background:var(--ink);margin:2px 0}
.ok{background:#DDF0DB!important;border-color:#3E8E41!important}
.ko{background:#FBE1CF!important;border-color:#D9641E!important}
.symboles{display:flex;gap:8px}

/* aides */
.pyth-w{overflow-x:auto}
table.pyth{border-collapse:collapse;margin:8px 0;font-variant-numeric:tabular-nums}
.pyth th,.pyth td{width:44px;height:44px;text-align:center;border:1px solid #D2CABB;font-size:18px;padding:0}
.pyth th{background:#ECE5D7;font-weight:700}
.pyth td{background:#fff;cursor:pointer}
.pyth .hl{background:#F7E7C2}
.pyth .sel{background:var(--h);color:var(--h-txt);font-weight:700}
.resultat-pyth{font-size:calc(var(--rs) * 1.6);font-weight:700;min-height:1.5em;font-variant-numeric:tabular-nums}
.fiches{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.fiche{background:#fff;border:2px solid var(--line);border-top:8px solid var(--fc);border-radius:8px;padding:14px;text-align:left;min-height:110px;font-family:var(--rf)}
.fiche b{display:block;font-size:18px;margin-bottom:6px}
.fiche span{font-size:14px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fiche-vue{white-space:pre-wrap}

/* pause */
.souffle{display:flex;flex-direction:column;align-items:center;gap:16px;padding:14px 0}
.bulle{width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#E9DFC9);border:5px solid var(--h);display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;letter-spacing:.08em;text-transform:uppercase;transform:scale(.62);transition-property:transform;transition-timing-function:ease-in-out}
.barre-prog{width:100%;max-width:420px;height:12px;border-radius:6px;background:#DDD5C7;overflow:hidden}
.barre-prog i{display:block;height:100%;background:var(--h);width:0;transition:width .3s linear}
.mouvement{font-size:calc(var(--rs) * 1.25);font-weight:600;text-align:center;max-width:560px;min-height:3em}

/* météo */
.meteos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.meteo-btn{background:#fff;border:2px solid var(--line);border-radius:10px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:16px;min-height:150px;text-align:center;font-family:var(--rf)}
.meteo-btn.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.meteo-btn svg{width:72px;height:72px}
.releves{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.releves svg{width:34px;height:34px}
.releve{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--ink2);width:46px}

/* carte de besoins (plein écran) */
.plein{position:fixed;inset:0;z-index:50;background:rgba(20,24,28,.8);overflow:auto;padding:18px}
.carte-id{max-width:740px;margin:16px auto;background:#FBF8F1;border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5);font-family:var(--rf)}
.carte-id .bandeau{background:var(--h);color:var(--h-txt);padding:18px 24px}
.carte-id .bandeau b{font-family:'Barlow Condensed',sans-serif;letter-spacing:.16em;text-transform:uppercase;font-size:15px;opacity:.85;display:block}
.carte-id h2{margin:4px 0 0;font-size:32px;line-height:1.15}
.carte-id .corps{padding:18px 26px 26px;font-size:20px;line-height:1.55}
.carte-id h4{font-family:'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:18px 0 6px;font-size:16px}
.carte-id ul{margin:0;padding-left:26px}
.plein .rang{max-width:740px;margin:0 auto}

/* popover Aa */
#pop{position:fixed;top:74px;right:12px;z-index:40;width:min(390px,calc(100vw - 24px));background:var(--paper);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.45);padding:18px;max-height:calc(100vh - 92px);overflow:auto;border-top:6px solid var(--h);font-size:16px}
.polices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.polices button{min-height:48px;border:2px solid #CDC5B6;border-radius:6px;background:#fff;font-size:17px}
.polices button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.fonds{display:flex;gap:8px;flex-wrap:wrap}
.fond{width:44px;height:44px;border-radius:8px;border:2px solid #BDB5A6}
.fond.on{border:3px solid var(--ink);box-shadow:0 0 0 2px #fff inset}
.apercu{padding:12px;border-radius:6px;border:2px solid var(--line);margin-top:12px;background:var(--rbg)}

/* atelier */
.ligne-lame{display:flex;align-items:center;gap:12px;padding:10px 12px;background:#fff;border:2px solid var(--line);border-radius:8px;margin:8px 0}
.ligne-lame>.ic{width:28px;height:28px;color:#4A5157}
.ligne-lame .grow{flex:1;min-width:0}
.ligne-lame .grow b{display:block}
.ligne-lame .grow small{color:var(--ink2);font-size:14px}
.ligne-lame.off{opacity:.62}
.manches{display:flex;gap:10px;flex-wrap:wrap}
.manche-c{width:52px;height:52px;border-radius:26px;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(0,0,0,.2),inset 6px 0 8px rgba(255,255,255,.25)}
.manche-c.on{border-color:var(--ink);box-shadow:0 0 0 3px #fff inset}

/* montage (accueil) */
.montage{max-width:780px;margin:0 auto;color:#F3EFE6}
.montage h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:46px;letter-spacing:.06em;text-transform:uppercase;margin:6px 0 4px;line-height:1}
.montage p{color:rgba(243,239,230,.82);font-size:17px}
.montage .lab{color:#F3EFE6}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:12px;margin-top:8px}
.pack{text-align:left;background:var(--paper);color:var(--ink);border:3px solid transparent;border-radius:10px;padding:16px 50px 16px 16px;min-height:128px;position:relative;font-family:'Lexend',sans-serif}
.pack.on{border-color:#F2B33D}
.pack .t{font-weight:700;font-size:18px;display:block}
.pack .d{font-size:14px;color:var(--ink2);margin-top:6px;display:block}
.pack .lst{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.07em;font-size:14px;margin-top:10px;color:var(--h);font-weight:700;display:block}
.pack .case{position:absolute;top:14px;right:14px}
.pack.on .case{background:var(--h);border-color:var(--h-dark);color:#fff}

#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140px);background:var(--ink);color:#fff;padding:13px 20px;border-radius:8px;transition:transform .3s,visibility .3s;visibility:hidden;z-index:60;font-size:16px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#toast.on{transform:translate(-50%,0);visibility:visible}

@media (max-width:600px){
  .manche{flex-basis:54px;border-radius:27px}
  .lames{margin-left:-26px}
  .lame{padding:10px 46px 10px 38px;min-height:64px;gap:10px}
  .lame .nom{font-size:20px}
  .lame .sous{font-size:13px}
  .lame .ic{width:26px;height:26px}
  .sheet{padding:22px 14px 26px}
  .gc,input.gc{width:40px;height:48px;font-size:24px}
  .icobtn .lbl{display:none}
  .marque small{display:none}
  .grille2{grid-template-columns:1fr}
  .montage h1{font-size:36px}
  .pyth th,.pyth td{width:32px;height:36px;font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media print{
  body{background:#fff}
  #bar,#view,#toast,#pop,.no-print{display:none!important}
  .plein{position:static;background:none;padding:0}
  .carte-id{box-shadow:none;border:2px solid #000}
}
</style>
</head>

        h('input', { type: 'checkbox', 'class': 'sw', checked: false, 'aria-label': 'Monter la lame ' + o.nom, onchange: function () { S.lames.push(o.id); sauver(); lames(); } })));
    });
  }
  lames();
  var manches = h('div', { 'class': 'manches' });
  Object.keys(COULEURS).forEach(function (k) {
    var b = h('button', { type: 'button', 'class': 'manche-c' + (S.couleur === k ? ' on' : ''), style: 'background:' + COULEURS[k].c, 'aria-label': 'Manche ' + COULEURS[k].nom, onclick: function () {
      S.couleur = k; sauver(); appliquerTheme(); var bs = manches.querySelectorAll('button'); for (var i = 0; i < bs.length; i++) bs[i].className = 'manche-c'; b.className = 'manche-c on';
    } });
    manches.appendChild(b);
  });
  var grav = h('input', { type: 'text', maxlength: '18', value: S.prenom, placeholder: 'Ton prénom', 'aria-label': 'Gravure', oninput: function () { S.prenom = grav.value.trim(); sauver(); } });
  var conf = h('div'); controlesLecture(conf);
  var fichier = h('input', { type: 'file', accept: '.json,application/json', hidden: true, onchange: function () {
    var f = fichier.files[0]; if (!f) return;
    var lr = new FileReader();
    lr.onload = function () {
      try { var d = JSON.parse(lr.result); if (!d || typeof d !== 'object' || d.v !== 1) throw new Error('format'); S = remplir(DEFAUT, d); sauver(); appliquerTheme(); toast('Sauvegarde importée.'); rAtelier(); }
      catch (e) { toast('Ce fichier n’est pas une sauvegarde du Multitool.'); }
    };
    lr.readAsText(f);
  } });
  var bEffacer = btn('Tout effacer', 'poubelle', function () {
    if (bEffacer._arme) { try { localStorage.removeItem(CLE); } catch (e) { } S = clone(DEFAUT); appliquerTheme(); toast('Tout a été effacé.'); aller(''); return; }
    bEffacer._arme = true; vider(bEffacer); ajoute(bEffacer, [ico('poubelle'), 'Sûr·e ? Touche encore pour effacer']);
    setTimeout(function () { bEffacer._arme = false; vider(bEffacer); ajoute(bEffacer, [ico('poubelle'), 'Tout effacer']); }, 4000);
  }, 'petit');
  ajoute(sh, [
    h('div', { 'class': 'titre' }, 'Mes lames'),
    h('p', { 'class': 'aide' }, 'Monte les lames qui t’aident, range les autres. Les flèches changent l’ordre sur le couteau.'), zl,
    h('div', { 'class': 'titre' }, 'Couleur du manche'), manches,
    h('div', { 'class': 'titre' }, 'Gravure'), grav,
    h('div', { 'class': 'titre' }, 'Confort de lecture'), conf,
    h('div', { 'class': 'titre' }, 'Sons'), bascule('Petits sons (fin du sablier, étape faite)', S.sons, function (on) { S.sons = on; sauver(); }),
    h('div', { 'class': 'titre' }, 'Sauvegarde'),
    h('p', { 'class': 'aide' }, 'Tout est enregistré sur cet appareil uniquement. Pour changer d’appareil, exporte une sauvegarde puis importe-la sur l’autre.'),
    h('div', { 'class': 'rang' },
      btn('Exporter ma sauvegarde', 'telecharger', function () {
        var blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }), a = h('a', { href: URL.createObjectURL(blob), download: 'multitool-sauvegarde-' + isoJour(new Date()) + '.json' });
        document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.parentNode.removeChild(a); }, 500);
      }),
      btn('Importer une sauvegarde', 'ouvrir', function () { fichier.click(); }), fichier),
    h('div', { 'class': 'rang', style: 'margin-top:20px' },
      btn('Refaire le montage', 'reprendre', function () { S.monte = false; sauver(); aller(''); }, 'petit'), bEffacer),
    h('p', { 'class': 'note', style: 'margin-top:24px' }, 'Multitool · by BROT2YOU — fonctionne sans compte et sans connexion une fois la page chargée (sauf certaines voix de lecture).')
  ]);
}

/* =========================================================
   Démarrage
   ========================================================= */
appliquerTheme();
route();

})();
</script>
